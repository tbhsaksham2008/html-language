<html>
    <header>
        <title>Admission Form</title>
    </header>
    <head>
        <h1>Admission Form</h1><br>
    </head>
    <body>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" name="fullname" id="fullname" maxlength="20" minlength="2" required placeholder="Jon Doe"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Jon@example.com"><br><br>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" maxlength="13" minlength="10" required><br><br>

            <label for="hobbie" required>Hobbies :</label><br><br>

            <input type="checkbox" name="hobbies" id="hobbie" value="Reading">Reading
            <input type="checkbox" name="hobbies" id="hobbie" value="Playing">Playing<br><br>

            <label for="gender" >Gender :</label><br><br>

            <input type="radio" name="gender" id="gender" value="Male">Male
            <input type="radio" name="gender" id="gender" value="Female">Female<br><br>

            <input type="submit">
            <input type="reset">
        </form>
    </body>
</html>
